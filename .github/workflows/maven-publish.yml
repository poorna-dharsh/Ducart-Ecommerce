name: Build and Deploy WAR Artifact

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build WAR with Maven
      run: mvn -B clean package

    - name: Run tests
      run: mvn test

    - name: List target folder contents
      run: ls -l target

    - name: Upload WAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ducart-WAR
        path: target/*.war

    - name: Deploy WAR to Tomcat
      env:
        TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
        TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        TOMCAT_CONTEXT: ${{ secrets.TOMCAT_CONTEXT }}
      run: |
        echo "Deploying WAR to Tomcat..."
        curl -v --upload-file target/*.war \
          "http://$TOMCAT_USER:$TOMCAT_PASSWORD@$TOMCAT_HOST/manager/text/deploy?path=$TOMCAT_CONTEXT&update=true"
